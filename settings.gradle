plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'fernflower-fixer'

//formatter:off
dependencyResolutionManagement.versionCatalogs.register('libs') {
    plugin 'licenser',    'net.minecraftforge.licenser'    version '1.2.0'
    plugin 'gradleutils', 'net.minecraftforge.gradleutils' version '3.3.21'
    plugin 'gitversion',  'net.minecraftforge.gitversion'  version '3.1.6'
    plugin 'changelog',   'net.minecraftforge.changelog'   version '3.1.3'
    plugin 'renamer',     'net.minecraftforge.renamer'     version '1.1.0'

    library 'fernflower',  'net.minecraftforge',  'fernflower'         version '0'

    library 'jopt',     'net.sf.jopt-simple',   'jopt-simple'      version '6.0-alpha-3'

    version 'asm', '9.9.1'
    library 'asm',         'org.ow2.asm', 'asm'         versionRef 'asm'
    library 'asm-tree',    'org.ow2.asm', 'asm-tree'    versionRef 'asm'
    library 'asm-commons', 'org.ow2.asm', 'asm-commons' versionRef 'asm'
    bundle 'asm', ['asm', 'asm-tree', 'asm-commons']
}

//formatter:on

include 'fernflower-fixer-inject'